name: Build EXE

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AutoHotkey v1
        shell: powershell
        run: |
          $installer = 'AutoHotkey_1.1.37.02_setup.exe'
          $url = 'https://github.com/AutoHotkey/AutoHotkey/releases/download/v1.1.37.02/AutoHotkey_1.1.37.02_setup.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process -FilePath ".\$installer" -ArgumentList '/S', '/U64' -Wait

      - name: Compile auto-install.exe
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $compiler = Join-Path $env:ProgramFiles 'AutoHotkey\Compiler\Ahk2Exe.exe'
          if (!(Test-Path $compiler)) {
            $compiler = Join-Path ${env:ProgramFiles(x86)} 'AutoHotkey\Compiler\Ahk2Exe.exe'
          }
          if (!(Test-Path $compiler)) {
            throw 'Ahk2Exe.exe not found after AutoHotkey installation.'
          }
          & $compiler /in auto-install.ahk /out dist\auto-install.exe /icon app.ico
          if (!(Test-Path dist\auto-install.exe)) {
            throw 'Compilation finished without creating dist\auto-install.exe.'
          }
          Get-Item dist\auto-install.exe

      - name: Compute release name
        if: github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          $date = Get-Date -Format 'yyyy-MM-dd'
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_TAG=build-$date"
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_NAME=Build $date"

      - name: Upload auto-install.exe
        uses: actions/upload-artifact@v4
        with:
          name: auto-install.exe
          path: dist/auto-install.exe
          retention-days: 7

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --force $env:RELEASE_TAG $env:GITHUB_SHA
          git push --force origin "refs/tags/$env:RELEASE_TAG"

          gh release view $env:RELEASE_TAG *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            gh release upload $env:RELEASE_TAG dist\auto-install.exe --clobber
            gh release edit $env:RELEASE_TAG --title $env:RELEASE_NAME --notes "Automated build for $env:GITHUB_SHA" --prerelease --latest=false
          } else {
            gh release create $env:RELEASE_TAG dist\auto-install.exe --title $env:RELEASE_NAME --notes "Automated build for $env:GITHUB_SHA" --prerelease --latest=false --target $env:GITHUB_SHA
          }
