name: Build EXE

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AutoHotkey v1
        shell: powershell
        run: |
          $installer = 'AutoHotkey_1.1.37.02_setup.exe'
          $url = 'https://github.com/AutoHotkey/AutoHotkey/releases/download/v1.1.37.02/AutoHotkey_1.1.37.02_setup.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process -FilePath ".\$installer" -ArgumentList '/S', '/U64' -Wait

      - name: Compile auto-install.exe
        shell: powershell
        run: |
          $compiler = Join-Path $env:ProgramFiles 'AutoHotkey\Compiler\Ahk2Exe.exe'
          if (!(Test-Path $compiler)) {
            $compiler = Join-Path ${env:ProgramFiles(x86)} 'AutoHotkey\Compiler\Ahk2Exe.exe'
          }
          if (!(Test-Path $compiler)) {
            throw 'Ahk2Exe.exe not found after AutoHotkey installation.'
          }
          & $compiler /in auto-install.ahk /icon app.ico

      - name: Compute release name
        if: github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          $date = Get-Date -Format 'yyyy-MM-dd'
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_TAG=build-$date"
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_NAME=Build $date"

      - name: Upload auto-install.exe
        uses: actions/upload-artifact@v4
        with:
          name: auto-install-exe
          path: auto-install.exe
          retention-days: 7

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG auto-install.exe --clobber
          } else {
            gh release create $env:RELEASE_TAG auto-install.exe --title $env:RELEASE_NAME --notes "Automated build for $env:GITHUB_SHA" --prerelease --latest=false --target $env:GITHUB_SHA
          }
